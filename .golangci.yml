version: "2"

linters:
  default: standard

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    # The module path has no dot, so both tools would otherwise take
    # leanfeed/... for standard library packages.
    gofumpt:
      module-path: leanfeed
    goimports:
      local-prefixes:
        - leanfeed
