name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push supersedes whatever is still running for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Keep these in step with the Makefile.
env:
  GOLANGCI_LINT_VERSION: v2.12.2
  GOVULNCHECK_VERSION: v1.6.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # go test runs a subset of vet, so the explicit pass is not redundant.
      - run: go vet ./...
      - run: go build ./...
      # The runner image includes Google Chrome. Naming it makes the browser
      # tests fail if it is missing, instead of skipping them.
      - run: go test -race ./...
        env:
          LEANFEED_CHROME: google-chrome

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Not golangci-lint-action: its released binaries are built against an
      # older Go than this module targets, and golangci-lint refuses to run in
      # that case. Building it here pins it to our own toolchain. Reporting of
      # formatting (gofumpt, goimports) is part of `run`.
      - name: Install golangci-lint
        run: GOTOOLCHAIN=local go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}
      - run: golangci-lint run

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install govulncheck
        run: GOTOOLCHAIN=local go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
      - run: govulncheck ./...
