{{define "layout" -}}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "allowScriptTags": false, "historyCacheSize": 0, "responseHandling": [{"code": "204", "swap": false}, {"code": "[23]..", "swap": true}, {"code": "^(400|409|413|422)$", "swap": true, "error": false}, {"code": "[45]..", "swap": false, "error": true}]}'>
<title>{{.Title}} · leanfeed</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/ui.js"></script>
<script src="/static/htmx.min.js" defer></script>
</head>
<body>
<div class="app">
{{template "sidebar" .Sidebar}}
<div class="splitter" data-resize="sidebar" role="separator" aria-orientation="vertical" aria-label="Resize the menu" title="Drag to resize, double-click to reset" tabindex="0"></div>
<main id="main" class="main">
{{if .Manage}}{{template "manage" .Manage}}{{else if .Appearance}}{{template "appearance" .Appearance}}{{else}}
{{with .List}}{{template "list" .}}{{end}}
{{template "entry-pane" .Entry}}
{{end}}
</main>
<div class="splitter" data-resize="list" role="separator" aria-orientation="vertical" aria-label="Resize the entry list" title="Drag to resize, double-click to reset" tabindex="0"></div>
<button type="button" class="menu-show" data-menu-toggle aria-label="Show menu" title="Show menu">»</button>
</div>
</body>
</html>
{{- end}}
